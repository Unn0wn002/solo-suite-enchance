# Scoped intentionally to the website's own root npm manifest (package.json).
# Does NOT cover platforms/*/ — those are separate distributable product
# checkouts with their own release cadence; platforms/codex/ already ships its
# own Dependabot config (platforms/codex/.github/dependabot.yml). Duplicating
# that here would file overlapping PRs against vendored/isolated trees.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
