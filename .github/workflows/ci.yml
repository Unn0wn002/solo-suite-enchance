name: CI

# Root-level CI for the Solo Suite AI extension platform. Nested platform
# workflow files are release/distribution sources and are not discovered by
# GitHub Actions from their nested locations, so this workflow exercises the
# repository-level and cross-platform contracts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tooling-tests:
    name: AI tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.13.0"
          cache: "npm"

      - run: npm ci
      - run: npm test

  agent-platform-validate:
    name: Agent platform structural validation (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Generated skill mirror parity
        run: python scripts/sync-agent-skills.py --check

      - name: Structural + parity + license + link + doc-freshness validation
        run: |
          python scripts/validate-agent-skills.py
          python scripts/validate-agent-platform.py
          python scripts/validate-workflow-command-parity.py
          python platforms/validate-distribution-parity.py
          python scripts/check-agent-licenses.py
          python scripts/check-agent-links.py
          python scripts/build-agent-audit.py --check
          python scripts/agent-token-report.py --check

      - name: Graph snapshot consistency
        run: python scripts/check-graph-freshness.py

  platform-distribution-smoke:
    name: Platform distribution smoke (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [claude, codex, antigravity]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Require distribution CI source
        shell: bash
        run: |
          set -euo pipefail
          test -f "platforms/${{ matrix.platform }}/.github/workflows/ci.yml"

      - name: Byte-compile distribution Python helpers
        shell: bash
        run: |
          set -euo pipefail
          python -W error::SyntaxWarning -m compileall -q -f "platforms/${{ matrix.platform }}"

  platform-distributions:
    name: Claude, Codex & Antigravity distribution validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned Codex validation requirements
        run: python -m pip install --require-hashes -r platforms/codex/requirements-dev.lock

      - name: Validate platform distributions
        shell: pwsh
        run: ./scripts/validate-platforms.ps1

  security:
    name: Dependency + remediation security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.13.0"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Dependency audit + high-risk remediation validation
        run: python scripts/agent-security.py --npm-audit
